plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = "pvpciv-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('autoConnect')) {
                programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
